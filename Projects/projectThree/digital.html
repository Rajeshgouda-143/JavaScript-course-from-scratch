<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITAL Clock</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to right bottom,rgba(58, 216, 255, 0.2),#4aa2ee);
        }

        #clock{
            padding: 20px;
            background-color: orange;
            color: #fff;
            font-size: 30px;
            border: none;
            outline: none;
            border-radius: 5px;
            box-shadow: 5px 5px 5px grey;

        }

        #banner{
            font-size: 30px;
            margin-block: 10px;
            /* font-family: sans-serif;     */
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="banner">Your Local Time</div>
        <div id="clock"></div>
    </div>
</body>

<script>
    const clock = document.getElementById("clock")

    setInterval(function(){
        let date = new Date()
        // console.log(date.toLocaleTimeString)
        clock.innerHTML = date.toLocaleTimeString();
    },1000)

    
</script>
</html>
