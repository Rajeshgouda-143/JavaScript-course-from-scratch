<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Color Change</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing:border-box;
        }

        body{
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        button{
            padding: 10px 20px;
            width: 150px;
        }

        #start{
            font-size: 20px;
            font-weight: 700;
            background-color: green;
            color: #fff;
            border: none;
            outline:none;
            border-radius: 5px;
        }

        #stop{
            font-size: 20px;
            font-weight: 700;
            background-color: red;
            color: #fff;
            border: none;
            outline:none;
            border-radius: 5px;
        }

    </style>
</head>
<body>
    <h1>Start should change the background color every second</h1>
    <button id="start">start</button>
    <button id="stop">stop</button>
</body>
<script src="./color.js"></script>
</html>
